# ============================================================
# Configuración de Tienda Sport (backend Spring Boot)
# Ningún usuario ni contraseña de base de datos está escrito aquí:
# todo se lee de variables de entorno. Si no se define la variable,
# se usa el valor local de desarrollo (sin contraseña). La única que NO tiene valor
# por defecto es JWT_SECRET (ver más abajo).
# ============================================================

# --- Base de datos ---
# Para usar la base de datos en la nube (Aiven) o la de otro equipo,
# se definen estas tres variables ANTES de arrancar la aplicación:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/venta_ropa_deportiva?useSSL=false&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tiendasport}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: Hibernate solo COMPRUEBA que las tablas coincidan con las entidades y nunca las modifica.
# Los cambios de tablas se hacen con los scripts versionados de la carpeta /db.
# (Si algún día necesitas desactivarlo, usa DDL_AUTO=none; no uses 'update' en producción.)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
# El registro de consultas SQL queda apagado; para depurar se activa con SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Tokens JWT ---
# SIN valor por defecto: si JWT_SECRET no está definida, la aplicación NO arranca.
# Debe tener mínimo 32 caracteres, aleatorios (ver application.properties.example).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}

# --- Servidor ---
server.port=${PORT:8081}

spring.jackson.property-naming-strategy=SNAKE_CASE

# Subida de fotos de productos (la web las reduce antes de enviarlas; el servidor acepta hasta 3 MB)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# ---- Correos de pedidos (confirmación y cambios de estado) ----
# Si no se define ninguna de las dos formas de envío, la tienda funciona igual y los correos simplemente no se envían.
# Opción A (recomendada en Render gratis, que bloquea SMTP): API HTTPS de Brevo -> BREVO_API_KEY + MAIL_FROM
# Opción B (SMTP, p. ej. Gmail o un hosting de pago): MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD + MAIL_FROM
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}
app.mail.brevo-api-key=${BREVO_API_KEY:}
